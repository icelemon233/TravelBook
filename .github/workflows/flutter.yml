name: Travel Book Android iOS Web
on:
  push:
    branches: [main, 'codex/flutter-travel-book-*']
    paths-ignore:
      - 'README*.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: travel-book-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.7'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify:assets
      - run: pnpm check:boundaries
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tools/generate_icons.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage --reporter expanded
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: travel-book-test-evidence
          path: |
            coverage/lcov.info
            .local/export-check
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify unsigned Android production build
        run: |
          flutter build apk --release
          git diff --exit-code -- pubspec.lock
      - uses: actions/upload-artifact@v6
        with:
          name: travel-book-android-release-unsigned
          path: build/app/outputs/flutter-apk/app-release*.apk
          retention-days: 14
      - name: Build Android development app with debug plugin registration
        run: |
          flutter build apk --debug
          git diff --exit-code -- pubspec.lock
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: travel-book-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android startup and platform storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: flutter test integration_test/native_smoke_test.dart --no-pub -d emulator-5554 --dart-define=NATIVE_TEST_DISPOSABLE=true --reporter expanded
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply pinned upstream iOS simulator log-readiness fix
        run: node tools/apply-ios-tool-fix.mjs
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - run: tar -czf build/travel-book-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v6
        with:
          name: travel-book-ios-simulator
          path: build/travel-book-ios-simulator.tar.gz
          retention-days: 14
      - name: Actual iOS simulator startup and platform storage
        run: node tools/run-ios-smoke.mjs
      - run: flutter build ios --release --no-codesign --no-pub
      - run: tar -czf build/travel-book-ios-device-unsigned.tar.gz -C build/ios/iphoneos Runner.app
      - uses: actions/upload-artifact@v6
        with:
          name: travel-book-ios-device-unsigned
          path: build/travel-book-ios-device-unsigned.tar.gz
          retention-days: 14
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --no-pub --base-href /cinna-travel-book/ --no-web-resources-cdn --no-wasm-dry-run
      - run: node tools/prepare-web.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: travel-book-web
          path: build/web
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, android, ios, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified Flutter Web
        id: deployment
        uses: actions/deploy-pages@v4
