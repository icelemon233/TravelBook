name: cinna_travel_book
description: Cinna Travel Book — Android、iOS、Web 共用的旅行路书。
publish_to: none
version: 4.0.1+2
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  characters: 1.4.1
  cupertino_icons: 2.0.0
  go_router: 18.1.0
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  file_selector: 1.1.0
  share_plus: 13.3.1
  pdf: 3.13.1
  printing: 5.15.1
  web: 1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  image: 4.12.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/maps/
    - assets/images/ganwan/attractions/
    - assets/images/tibet/generated/
    - assets/fonts/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
